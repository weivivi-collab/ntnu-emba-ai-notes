<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2100" role="img" aria-labelledby="map-title map-desc"><title id="map-title">台師大 EMBA 產業分析課程</title><desc id="map-desc">architect: prof. shihmin Lo。依兩頁手寫筆記編輯重整為六個節點：MVP 回饋、商業模式、市場擴散、職能設計、AI 工作方式、輸入到產出。順序為教學整理，不表示原稿唯一因果順序。</desc><defs><marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="m0 0 6 4-6 4" fill="none" stroke="#536b81" stroke-width="1.2"/></marker></defs><style>text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#ebf2f8}.eyebrow{font-family:monospace;font-size:18px;letter-spacing:3px;fill:#92a7b9}.title{font-size:48px;font-weight:600;letter-spacing:1px}.sub{font-size:25px;fill:#a2b6c7}.node-title{font-size:32px;font-weight:600}.body{font-size:22px;fill:#bdcad7}.label{font-family:monospace;font-size:17px;letter-spacing:2px;fill:#93a9ba}.number{font-family:monospace;font-size:24px}.foot{font-size:19px;fill:#92a7b9}</style><rect width="1200" height="2100" fill="#08121f"/><path d="M80 66h1040" stroke="#26384b"/><text x="80" y="110" class="eyebrow">NTNU · EMBA / STRATEGY × AI SYSTEMS</text><text x="80" y="185" class="title">台師大 EMBA 產業分析課程</text><text x="80" y="230" class="sub">architect: prof. shihmin Lo</text><text x="80" y="283" class="body">從手寫思考，到系統化行動。六個節點，一個決策循環。</text><g><rect x="172" y="340" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 362v164" stroke="#65e4d4" stroke-width="3"/><circle cx="112" cy="377" r="30" fill="#0e1c2a" stroke="#65e4d4"/><text x="112" y="385" text-anchor="middle" class="number" style="fill:#65e4d4">01</text><text x="205" y="374" class="label" style="fill:#65e4d4">VALIDATE</text><text x="205" y="419" class="node-title">最小驗證與市場回饋</text><text x="205" y="451" class="label">MVP → TEST → MARKET FEEDBACK</text><text x="205" y="491" class="body">ClassQA／IRS 即時回應：Slido・Mentimeter・Kahoot</text><text x="205" y="525" class="body">建立 → 衡量 → 學習 ↺　用回饋修正假設</text></g><path d="M112 409v180" stroke="#3b5268" marker-end="url(#flow-arrow)"/><g><rect x="172" y="590" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 612v164" stroke="#f0c07a" stroke-width="3"/><circle cx="112" cy="627" r="30" fill="#0e1c2a" stroke="#f0c07a"/><text x="112" y="635" text-anchor="middle" class="number" style="fill:#f0c07a">02</text><text x="205" y="624" class="label" style="fill:#f0c07a">DESIGN</text><text x="205" y="669" class="node-title">商業模式與市場範圍</text><text x="205" y="701" class="label">BMC · VALUE PROPOSITION · TARGET AUDIENCE</text><text x="205" y="741" class="body">VP 價值主張 × TA 目標客群 → 商業模式九要素</text><text x="205" y="775" class="body">TAM 整體潛在市場 → SAM 可服務市場 → SOM 可取得市場</text></g><path d="M112 659v180" stroke="#3b5268" marker-end="url(#flow-arrow)"/><g><rect x="172" y="840" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 862v164" stroke="#f0c07a" stroke-width="3"/><circle cx="112" cy="877" r="30" fill="#0e1c2a" stroke="#f0c07a"/><text x="112" y="885" text-anchor="middle" class="number" style="fill:#f0c07a">03</text><text x="205" y="874" class="label" style="fill:#f0c07a">DIFFUSE</text><text x="205" y="919" class="node-title">創新擴散與跨越鴻溝</text><text x="205" y="951" class="label">EARLY ENTHUSIASM → MAINSTREAM TRUST</text><text x="205" y="991" class="body">創新者 2.5% → 早期採用者 13.5%　│鴻溝│</text><text x="205" y="1025" class="body">早期大眾 34% → 晚期大眾 34% → 落後採用者 16%</text></g><path d="M112 909v180" stroke="#3b5268" marker-end="url(#flow-arrow)"/><g><rect x="172" y="1090" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 1112v164" stroke="#b7a9ff" stroke-width="3"/><circle cx="112" cy="1127" r="30" fill="#0e1c2a" stroke="#b7a9ff"/><text x="112" y="1135" text-anchor="middle" class="number" style="fill:#b7a9ff">04</text><text x="205" y="1124" class="label" style="fill:#b7a9ff">ORGANIZE</text><text x="205" y="1169" class="node-title">角色分工與職能設計</text><text x="205" y="1201" class="label">PM / PjM → JOB DESCRIPTION → K · S · A</text><text x="205" y="1241" class="body">PM 產品價值　／　PjM 專案交付</text><text x="205" y="1275" class="body">JD 工作內容 → 知識 K・技能 S・態度 A*</text></g><path d="M112 1159v180" stroke="#3b5268" marker-end="url(#flow-arrow)"/><g><rect x="172" y="1340" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 1362v164" stroke="#b7a9ff" stroke-width="3"/><circle cx="112" cy="1377" r="30" fill="#0e1c2a" stroke="#b7a9ff"/><text x="112" y="1385" text-anchor="middle" class="number" style="fill:#b7a9ff">05</text><text x="205" y="1374" class="label" style="fill:#b7a9ff">ENABLE</text><text x="205" y="1419" class="node-title">AI 工作方式的三個層次</text><text x="205" y="1451" class="label">CHAT → WORK AGENT → CODING AGENT</text><text x="205" y="1491" class="body">對話釐清 → 任務完成 → 系統建置</text><text x="205" y="1525" class="body">先定義成果與驗收，再選工具、權限與執行方式</text></g><path d="M112 1409v180" stroke="#3b5268" marker-end="url(#flow-arrow)"/><g><rect x="172" y="1590" width="948" height="208" rx="10" fill="#101e2d" stroke="#23384c"/><path d="M172 1612v164" stroke="#65e4d4" stroke-width="3"/><circle cx="112" cy="1627" r="30" fill="#0e1c2a" stroke="#65e4d4"/><text x="112" y="1635" text-anchor="middle" class="number" style="fill:#65e4d4">06</text><text x="205" y="1624" class="label" style="fill:#65e4d4">DELIVER</text><text x="205" y="1669" class="node-title">從輸入到可交付成果</text><text x="205" y="1701" class="label">INPUT → PROCESS → OUTPUT / ARTIFACTS</text><text x="205" y="1741" class="body">目標與資料 → Project／Session → 模型與工具 → 驗證</text><text x="205" y="1775" class="body">交付 PPT・PDF・試算表・SVG・互動網站</text></g><path d="M65 1740V407q0-30 20-30" fill="none" stroke="#65e4d4" stroke-opacity=".55" stroke-dasharray="5 7"/><text transform="translate(43 1280) rotate(-90)" class="label" style="fill:#65e4d4">EVIDENCE → LEARNING → ITERATION</text><rect x="80" y="1850" width="1040" height="80" rx="8" fill="#14283a"/><text x="105" y="1884" class="body">人工把關：隱私・安全風險・倫理・資料來源・成果正確性</text><text x="105" y="1912" class="label">HUMAN REVIEW / THROUGHOUT THE SYSTEM</text><path d="M80 1960h1040" stroke="#26384b"/><text x="80" y="1997" class="foot">編輯重整：跨頁閱讀順序，非原稿唯一因果流程。比例採先前指定的經典模型。</text><text x="80" y="2028" class="foot">待確認：「65%」、部分工具與職級標記；* A 暫作 Attitudes。數字為示意。</text><text x="80" y="2070" class="eyebrow">PORTRAIT / SYSTEMATIZED · STRUCTURED · PROCESS-ORIENTED</text></svg>